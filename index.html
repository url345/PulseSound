<!DOCTYPE html>

<style>

.nav{flex-wrap:wrap;gap:8px}.srch{order:5;flex:1 1 100%}.srch input{padding:11px 14px;border-radius:999px;background:var(--bg)}

.bn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.bn div{background:var(--bg);border-radius:16px;padding:14px 12px;font-weight:700;font-size:14px}.bn span{display:block;font-size:22px}.bn small{display:block;color:var(--mut);font-weight:500}
.sec2{margin-top:20px}.sec2 h2{font-size:22px;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 14px;font-weight:700;font-size:14px;min-height:44px}.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.rv{border-top:1px solid var(--line);padding:12px 0}
details{border-top:1px solid var(--line);padding:4px 0}summary{cursor:pointer;font-weight:800;padding:14px 0;min-height:44px}details p{margin:0 0 14px;color:var(--mut)}
.bar2{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}.bar2 i{display:block;height:100%;background:var(--acc)}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:none;align-items:center;gap:14px;box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.sticky .btn{flex:1;padding:14px}.sticky b{font-family:Sora;font-size:20px;white-space:nowrap}

footer{padding-bottom:110px}
.nav{flex-wrap:nowrap;gap:8px;padding:8px 12px}.srch{order:0;flex:1 1 auto;min-width:0}.srch input{padding:11px 16px;border-radius:999px;background:var(--bg);border:0}.ic{border:0;background:none}.bk{margin-left:-6px}
main.product{max-width:560px;padding:0}main.product .stage{aspect-ratio:1/1;border-radius:0;cursor:default}
.tabs{position:sticky;top:calc(var(--hh,60px) + env(safe-area-inset-top,0px));z-index:15;background:var(--card);display:flex;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{flex:none;border:0;background:none;color:var(--mut);font-weight:700;padding:14px 16px;min-height:48px;border-bottom:3px solid transparent}.tabs button:first-child{color:var(--ink);border-color:var(--ink)}
.blk{background:var(--card);padding:16px;margin-top:8px;scroll-margin-top:calc(var(--hh,60px) + 56px)}.blk h2{font-size:19px;margin-bottom:10px}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:26px;line-height:1;padding:0}.arr.l{left:10px}.arr.r{right:10px}
.cnt{right:12px;bottom:12px;font-size:14px}
.pbanner{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px;background:linear-gradient(100deg,#ff7a1a,#ff3d2e);color:#fff}
.pbanner:not(.on){background:var(--card);color:var(--ink)}.pp{font-family:Sora;font-weight:800;font-size:34px}.pp s{font-size:15px;font-weight:600;opacity:.85;display:block}
.pr2{text-align:right;display:grid;gap:2px;font-size:14px}.pr2 b{font-family:Sora;font-size:17px}.pbanner .off{background:#fff;color:#ff3d2e}
.pixl div{background:none;padding:0}.gr{color:var(--ok)}
.trow{display:flex;gap:12px;align-items:flex-start}.trow svg{flex:none;margin-top:3px}
.opts{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px}.opt{flex:none;width:68px;border:2px solid var(--line);border-radius:12px;background:#eef0f4;padding:3px;color:#16181d;font-size:11px;font-weight:700}.opt[aria-pressed=true]{border-color:var(--acc)}.opt svg{width:100%;display:block}
.store{display:flex;gap:12px;align-items:center}.av{width:48px;height:48px;border-radius:50%;background:var(--acc);display:grid;place-items:center;font-family:Sora;font-weight:800;font-size:20px;color:#fff}
.sticky{max-width:560px;margin:auto;background:#101114;border-top:1px solid var(--line);gap:10px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.sb-i{border:0;background:none;color:var(--mut);font-size:12px;display:grid;justify-items:center;gap:2px;min-width:48px;min-height:48px}
.sb-c{border:0;background:#3a1620;color:var(--acc2);border-radius:12px;width:52px;height:52px;display:grid;place-items:center;flex:none}
.sb-b{flex:1;border:0;background:var(--acc);color:#fff;border-radius:12px;min-height:52px;padding:6px;font-weight:800;line-height:1.2;font-size:13px}.sb-b b{display:block;font-size:19px;font-family:Sora;white-space:normal}.sb-b span{font-weight:600;font-size:12px}
.rav{position:relative;width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}.rav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam{width:26px;height:26px;border-radius:50%;border:0;background:var(--line);color:var(--ink);padding:0;margin:0 8px 0 6px;vertical-align:middle;position:relative;display:inline-grid;place-items:center}.cam::after{content:'';position:absolute;inset:-9px}
.lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:grid;align-content:center;justify-items:center;overflow:auto;padding:16px;gap:12px}.lb img{max-width:100%;max-height:80vh;border-radius:12px}
.pixcode{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:normal;font-size:14px}
.sec{text-align:center;color:var(--mut);font-size:13px;margin-top:12px}
.empty{text-align:center;padding:40px 10px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:30px 16px 90px}
.ok-ico{width:72px;height:72px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 14px}
.pix{background:var(--bg);border-radius:14px;padding:12px;font-size:13px;word-break:break-all;margin-top:10px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header id="hd"><div class="nav"><button class="ic bk" onclick="go('product')" aria-label="Voltar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></button>
<form class="srch" onsubmit="event.preventDefault();go('product')"><input type="search" placeholder="Pesquisar" aria-label="Pesquisar"></form>
<button class="ic" id="fav" onclick="S.fav=!S.fav;this.textContent=S.fav?'♥':'♡';this.style.color=S.fav?'#fe2c55':''" aria-label="Favoritar">♡</button>
<button class="ic" onclick="share()" aria-label="Compartilhar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg></button>
<button class="ic" style="position:relative" onclick="go('cart')" aria-label="Abrir carrinho"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 4h2l2.4 11h10.2L20 7H6"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/></svg><span class="badge" id="badge" style="position:absolute;top:-4px;right:-4px">0</span></button></div></header>

<script>
const CFG={orig:0,offerEnd:'',pixOff:0,inst:0,stock:{left:0,total:0},reviews:[{n:'Luiza',p:'9b262c238fbbc3f69af7f7da1be65c0f.jpg',s:5,t:'Gostei muito! Chegou certinho, até antes do prazo.',d:''},{n:'David',p:'aa67d33177aa777da7ca223cbedad2d2.jpg',s:5,t:'Chegou antes do prazo. Qualidade muito boa!',d:''}],specs:[],warranty:'',faq:[]};
const PRICE=100,FRETE=11.5,BUMP=32.5;
const COLORS=[{n:'Preto',h:'#1b1d22',bg:'#e9ecf1'},{n:'Branco',h:'#f3f4f6',bg:'#e4e7ec'}];
const S={view:'product',color:0,qty:1,view3:'front',cart:[],cep:'',cepOk:false,addr:{},pay:'pix',bump:false,order:null};
const R=v=>'R$ '+v.toFixed(2).replace('.',',');
const $=id=>document.getElementById(id);
const PH={0:'913c66b8e7c1f30255dd0caae10a8191.jpg',1:'1791153835528.jpg'};
function spk(c,v){const sv=spk0(c,v),f=PH[c];if(!f||v!=='front')return sv;return `<span style="position:relative;display:grid;place-items:center;width:100%;aspect-ratio:1/1">${sv}<img src="${f}" alt="Caixa de som JBL ${COLORS[c].n}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:inherit" onload="this.previousElementSibling.style.visibility='hidden'" onerror="this.remove()"></span>`}
function spk0(c,v){const h=COLORS[c].h,tx=c===1?'#16181d':'#fff';
 const grille=Array.from({length:7},(_,i)=>`<rect x="${70+i*8}" y="92" width="3" height="76" rx="1.5" fill="#000" opacity=".28"/>`).join('')+Array.from({length:7},(_,i)=>`<rect x="${300+i*8}" y="92" width="3" height="76" rx="1.5" fill="#000" opacity=".28"/>`).join('');
 if(v==='front')return `<svg viewBox="0 0 440 260" role="img" aria-label="Caixa de som JBL ${COLORS[c].n}, vista frontal"><ellipse cx="220" cy="228" rx="170" ry="12" fill="#000" opacity=".12"/><rect x="40" y="60" width="360" height="150" rx="75" fill="${h}"/><rect x="40" y="60" width="360" height="70" rx="35" fill="#fff" opacity=".1"/>${grille}<circle cx="220" cy="130" r="32" fill="#000" opacity=".22"/><circle cx="220" cy="130" r="26" fill="${h}" stroke="#fff" stroke-opacity=".35" stroke-width="2"/><text x="220" y="137" text-anchor="middle" font-family="Sora,sans-serif" font-weight="800" font-size="19" fill="${tx}">JBL</text><rect x="150" y="190" width="140" height="6" rx="3" fill="#fff" opacity=".25"/></svg>`;
 if(v==='side')return `<svg viewBox="0 0 440 260"><ellipse cx="220" cy="228" rx="90" ry="10" fill="#000" opacity=".12"/><circle cx="220" cy="135" r="92" fill="${h}"/><circle cx="220" cy="135" r="70" fill="#000" opacity=".2"/><circle cx="220" cy="135" r="62" fill="${h}"/><circle cx="220" cy="135" r="22" fill="#000" opacity=".22"/><circle cx="220" cy="135" r="48" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3"/><path d="M130 100a92 92 0 0 1 90-47" stroke="#fff" stroke-opacity=".25" stroke-width="6" fill="none" stroke-linecap="round"/></svg>`;
 return `<svg viewBox="0 0 440 260"><ellipse cx="220" cy="232" rx="170" ry="10" fill="#000" opacity=".1"/><rect x="40" y="95" width="360" height="100" rx="50" fill="${h}"/><rect x="60" y="105" width="320" height="22" rx="11" fill="#000" opacity=".2"/>${[0,1,2,3,4].map(i=>`<circle cx="${150+i*35}" cy="116" r="7" fill="#fff" opacity="${i==2?.9:.5}"/>`).join('')}<rect x="60" y="140" width="320" height="40" rx="20" fill="#fff" opacity=".08"/><text x="220" y="167" text-anchor="middle" font-family="Sora,sans-serif" font-weight="800" font-size="20" fill="${tx}" opacity=".9">JBL</text></svg>`}
const ICON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const TRUST=['Compra segura','Pagamento seguro','Envio para todo o Brasil','Suporte via WhatsApp'].map(t=>`<div>${ICON}${t}</div>`).join('');
const cnt=()=>S.cart.reduce((a,i)=>a+i.q,0);
const sub=()=>S.cart.reduce((a,i)=>a+i.q*PRICE,0);
const bumpv=()=>S.bump?BUMP:0;
const frete=()=>S.cepOk&&S.cart.length?FRETE:0;
function go(v){S.view=v;render();window.scrollTo(0,0)}

function mask(v,t){v=v.replace(/\D/g,'');if(t==='cep')return v.slice(0,8).replace(/(\d{5})(\d)/,'$1-$2');
 if(t==='cpf')return v.slice(0,11).replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');

function cpfOk(c){c=c.replace(/\D/g,'');if(c.length!==11||/^(\d)\1+$/.test(c))return false;
 for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=c[i]*(t+1-i);if((s*10%11)%10!=c[t])return false}return true}
